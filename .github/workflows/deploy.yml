name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout q-wash-worker
        uses: actions/checkout@v4
        with:
          path: q-wash-worker

      - name: Checkout q-wash-shared
        uses: actions/checkout@v4
        with:
          repository: andre1ka-ber/q-wash-shared
          token: ${{ secrets.GH_PAT }}
          path: q-wash-shared

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: q-wash-worker/package-lock.json

      - name: Install q-wash-shared deps
        working-directory: q-wash-shared
        run: npm ci

      - name: Install deps
        working-directory: q-wash-worker
        run: npm ci

      - name: Build
        working-directory: q-wash-worker
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Deploy dist to server
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: q-wash-worker/dist/
          remote_path: /var/www/q-wash-worker/dist/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
